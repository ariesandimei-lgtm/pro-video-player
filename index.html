<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PRO Video Player V3.5</title>


<link 
rel="stylesheet" 
href="css/player.css"
>

</head>


<body>


<main class="app">


<h1 class="app-title">
PRO VIDEO PLAYER
</h1>


<p class="app-subtitle">
Smart Indonesian Subtitle Engine
</p>





<section class="player-wrapper">



<!-- VIDEO -->

<video
id="videoPlayer"
playsinline
preload="metadata"
>

<source
src="./video/sample.mp4"
type="video/mp4"
>

Browser tidak mendukung video HTML5.

</video>







<!-- MAIN CONTROL -->


<div class="player-controls">


<button onclick="togglePlay()">

▶ / ⏸

</button>



<input
type="range"
id="progressBar"
value="0"
min="0"
max="100"
>



<button onclick="toggleMute()">

🔊

</button>



<input
type="range"
id="volumeControl"
value="100"
min="0"
max="100"
>



<button onclick="fullscreenVideo()">

⛶

</button>



</div>









<!-- QUALITY CONTROL -->


<div class="quality-controls">


<button onclick="changeQuality('720')">

720p

</button>



<button onclick="changeQuality('1080')">

1080p

</button>



<button onclick="changeQuality('1440')">

1440p

</button>



<button onclick="changeQuality('2160')">

4K

</button>



</div>









<!-- SPEED CONTROL -->


<div class="controls">


<button onclick="changeSpeed(0.5)">

0.5x

</button>



<button onclick="changeSpeed(1)">

1x

</button>



<button onclick="changeSpeed(1.5)">

1.5x

</button>



<button onclick="changeSpeed(2)">

2x

</button>


</div>









<!-- SUBTITLE CONTROL -->


<div class="subtitle-controls">


<button onclick="toggleSubtitle()">

Subtitle ON/OFF

</button>




<button onclick="subtitleSize('small')">

Small

</button>




<button onclick="subtitleSize('medium')">

Medium

</button>




<button onclick="subtitleSize('large')">

Large

</button>





<button onclick="subtitleDelay(-0.5)">

-500ms

</button>





<button onclick="subtitleDelay(0)">

0ms

</button>





<button onclick="subtitleDelay(0.5)">

+500ms

</button>



</div>










<!-- SUBTITLE DISPLAY -->


<div
id="subtitleContainer"
class="subtitle-container"
aria-live="polite"
>

</div>





</section>









<!-- STATUS -->


<div class="status-panel">


<span>

Subtitle:

<strong id="subtitleStatus">

Memuat...

</strong>


</span>


</div>









<script src="js/subtitle-engine.js"></script>


<script src="js/player.js"></script>



</body>


</html>
